[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bmx-ble"
version = "0.1.0"
description = "BLE protocol support for BM2 battery monitors"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Andrew Stewart"}]
keywords = ["BM2", "Bluetooth", "BLE", "battery-monitor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
dependencies = [
    "bleak>=0.22.0",
    "bleak-retry-connector>=3.0.0",
    "pycryptodome>=3.20.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.urls]
Repository = "https://github.com/andystewart999/bmx-ble"
Issues = "https://github.com/andystewart999/bmx-ble/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
